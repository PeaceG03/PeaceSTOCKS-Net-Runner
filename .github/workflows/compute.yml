name: compute

# Public compute only. Never runs on pull_request: the net-read environment is main-only and this workflow
# has no PR trigger. Results leave only as an age-encrypted artifact (1-day retention) that Net collects.
on:
  schedule:
    - cron: "41 11 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "full (replay + forecast) or proof (load newest session only)"
        type: choice
        options: [full, proof]
        default: full
      diagnose:
        description: "seal Net's private failure diagnostics instead of failing (owner dispatch only)"
        type: boolean
        default: false
      net_ref:
        description: "run exactly this Net commit (full 40-hex SHA); empty = Net main"
        type: string
        default: ""

permissions: {}

concurrency:
  group: compute
  cancel-in-progress: false

jobs:
  compute:
    name: compute
    if: >-
      github.repository == 'PeaceG03/PeaceSTOCKS-Net-Runner' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && github.triggering_actor == 'PeaceG03'))
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    environment: net-read
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install age
        run: ./runner/bin/install-age.sh
      - name: Read Net
        env:
          DEPLOY_KEY: ${{ secrets.NET_READ_DEPLOY_KEY }}
          # Scheduled runs: empty (Net main). Validated and verified in clone-net.sh (fails closed).
          NET_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.net_ref || '' }}
        run: ./runner/bin/clone-net.sh "$RUNNER_TEMP/net"
      - name: Prepare
        run: ./runner/bin/prepare-net.sh "$RUNNER_TEMP/net"
      - name: Verify Net ref
        env:
          NET_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.net_ref || '' }}
        run: |
          [ -z "$NET_REF" ] && { echo "PASS net main"; exit 0; }
          [ "$(git -C "$RUNNER_TEMP/net" rev-parse HEAD)" = "$NET_REF" ] && echo "PASS net ref verify" || { echo "FAIL net ref verify"; exit 1; }
      # The read-only R2 token reaches only the two steps below, mapped to the reader's names here.
      # Account id and bucket come from this environment; nothing about them is in this repo or its logs.
      - name: R2 probe
        env:
          PEACESTOCKS_R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          PEACESTOCKS_R2_BUCKET: ${{ vars.R2_BUCKET }}
          PEACESTOCKS_R2_ACCESS_KEY_ID: ${{ secrets.R2_READ_ACCESS_KEY_ID }}
          PEACESTOCKS_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_READ_SECRET_ACCESS_KEY }}
        run: ./runner/bin/r2-probe.sh "$RUNNER_TEMP/net"
      - name: Compute
        env:
          NET_SOURCE: r2
          NET_ALLOW_R2_READ: "1"
          NET_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'full' }}
          NET_DIAG: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnose && '1' || '0' }}
          PEACESTOCKS_R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          PEACESTOCKS_R2_BUCKET: ${{ vars.R2_BUCKET }}
          PEACESTOCKS_R2_ACCESS_KEY_ID: ${{ secrets.R2_READ_ACCESS_KEY_ID }}
          PEACESTOCKS_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_READ_SECRET_ACCESS_KEY }}
        run: ./runner/bin/compute.sh "$RUNNER_TEMP/net" "$RUNNER_TEMP/out" 2>/dev/null || { echo "FAIL compute"; exit 1; }
      - name: Seal
        run: ./runner/bin/seal.sh "$RUNNER_TEMP/out" "$RUNNER_TEMP/sealed/results.tar.age"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-enc
          path: ${{ runner.temp }}/sealed/results.tar.age
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
      - name: Delete Net and plaintext
        if: always()
        run: rm -rf "$RUNNER_TEMP/net" "$RUNNER_TEMP/out" "$RUNNER_TEMP"/net-ssh.* "$RUNNER_TEMP"/results.*.tar
